name: Fix recipe detail layout

on:
  push:
    paths:
      - '.github/workflows/fix-recipe-detail.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recipe photo capture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # The old prototype used a hard-coded recipe for every uploaded image.
          start=s.find('function testRecipePreview(target){')
          end=s.find('\nfunction captureSelected',start)
          if start>=0 and end>=0:
              fn='''async function testRecipePreview(target,imageData){target.innerHTML='<b>Reading your photo…</b><div class="small" style="margin-top:8px">Checking the uploaded image.</div>';target.style.display='block';window._captureRecipe={name:'Captured recipe',notes:''};if(!imageData||typeof Tesseract==='undefined'){target.innerHTML='<b>Photo captured</b><div class="small" style="margin-top:8px">Add the recipe name or notes before saving.</div>';return}try{let result=await Tesseract.recognize(imageData,'eng');let text=(result.data.text||'').replace(/\\r/g,'').split('\\n').map(v=>v.trim()).filter(Boolean);let lines=text.filter(v=>/\\b(cup|cups|tbsp|tsp|tablespoon|teaspoon|oz|ounce|lb|pound|gram|grams|ml|kg|ingredient|direction|instruction|salt|pepper|flour|sugar|cheese|chicken|beef|pork|garlic|onion)\\b/i.test(v));let title=(text.find(v=>v.length>=5&&v.length<=90&&!/^(ingredients?|directions?|instructions?)$/i.test(v))||'Captured recipe').replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9)]+$/g,'').trim();let notes=lines.slice(0,20).join('\\n');window._captureRecipe={name:title||'Captured recipe',notes};if(lines.length){target.innerHTML='<b>Photo read → Recipes</b><div>'+((title||'Captured recipe').replace(/</g,'&lt;'))+'</div><ul>'+lines.slice(0,8).map(v=>'<li>'+v.replace(/</g,'&lt;')+'</li>').join('')+'</ul><div class="small" style="margin-top:8px">Review before saving.</div>'}else{target.innerHTML='<b>Photo captured</b><div class="small" style="margin-top:8px">No clear recipe text found. Enter the details manually.</div>'}}catch(err){window._captureRecipe={name:'Captured recipe',notes:''};target.innerHTML='<b>Photo captured</b><div class="small" style="margin-top:8px">I could not read the text from this image. Enter the details manually.</div>'}}'''
              s=s[:start]+fn+s[end:]

          start=s.find('function captureSelected(){')
          end=s.find('\nfunction recipeSelected',start)
          if start>=0 and end>=0:
              fn='''function captureSelected(){let f=document.getElementById('captureFile').files[0];if(!f)return;let p=document.getElementById('capturePreview');if(f.type.startsWith('image/')){let r=new FileReader();r.onload=()=>{p.innerHTML='<img src="'+r.result+'">';p.style.display='block';testRecipePreview(document.getElementById('captureAi'),r.result)};r.readAsDataURL(f)}else{p.innerHTML='<div class="card">Video selected.</div>';p.style.display='block';window._captureRecipe=null}}'''
              s=s[:start]+fn+s[end:]

          start=s.find('function recipeSelected(){')
          end=s.find('\nfunction saveModal',start)
          if start>=0 and end>=0:
              fn='''function recipeSelected(){let f=document.getElementById('recipeFile').files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{let p=document.getElementById('recipePreview');p.innerHTML='<img src="'+r.result+'">';p.style.display='block';await testRecipePreview(document.getElementById('recipeAi'),r.result);let rec=window._captureRecipe||{};if(!document.getElementById('recipeName').value&&rec.name)document.getElementById('recipeName').value=rec.name;if(!document.getElementById('recipeNotes').value&&rec.notes)document.getElementById('recipeNotes').value=rec.notes};r.readAsDataURL(f)}'''
              s=s[:start]+fn+s[end:]

          # Replace the Quick Capture image-save block regardless of whitespace/line wrapping.
          pattern=r"if\(file&&file\.type\.startsWith\('image/'\)\)\{let r=new FileReader\(\);r\.onload=\(\)=>\{data\.recipes\.push\(\{name:'Dill Pickle Ranch Crunch Cheese Ball Bites'.*?r\.readAsDataURL\(file\);return\}"
          replacement="if(file&&file.type.startsWith('image/')){let r=new FileReader();r.onload=()=>{let rec=window._captureRecipe||{};data.recipes.push({name:(rec.name||'Captured recipe'),link:'',notes:(rec.notes||text),image:r.result,date:new Date().toLocaleDateString(),source:'Quick Capture'});closeModal();save();show('recipes')};r.readAsDataURL(file);return}"
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)

          # Remove any remaining hard-coded demo defaults in the recipe form.
          s=re.sub(r"if\(!document\.getElementById\('recipeName'\)\.value\)document\.getElementById\('recipeName'\)\.value='Dill Pickle Ranch Crunch Cheese Ball Bites';",'',s)
          s=re.sub(r"if\(!document\.getElementById\('recipeNotes'\)\.value\)document\.getElementById\('recipeNotes'\)\.value='8 oz cream cheese, softened\\n1 cup shredded sharp cheddar cheese\\n½ cup finely chopped dill pickles, well drained'",'',s)

          if 'tesseract.min.js' not in s:
              s=s.replace('</body></html>','<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></body></html>')

          # Marker lets us verify this exact repair was applied.
          if '<!-- recipe-photo-fix-v2 -->' not in s:
              s=s.replace('</head>','<!-- recipe-photo-fix-v2 --></head>')
          p.write_text(s)
          print('recipe photo patch matches:',n)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Fix uploaded recipe photo handling [skip ci]'
          git push
