name: Fix recipe detail layout

on:
  push:
    paths:
      - '.github/workflows/fix-recipe-detail.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recipe detail and deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = '.recipe-detail-img{width:100%;max-height:65vh;object-fit:contain;border-radius:16px;background:#050506;margin:8px 0 14px}'
          new_css = '.recipe-detail-img{width:100%;height:180px;object-fit:cover;border-radius:18px;background:#050506;margin:8px 0 14px}.recipe-detail-wrap{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start}.recipe-detail-wrap .recipe-detail-img{margin:0}.recipe-detail-info h2{font-size:24px;line-height:1.08;margin:0 0 10px}.recipe-detail-info .small{margin:5px 0}.recipe-detail-ingredients{margin-top:16px;padding:15px;border:1px solid #ffffff10;background:#151518;border-radius:16px}.recipe-detail-ingredients div{padding:6px 0;border-bottom:1px solid #ffffff10}.recipe-detail-ingredients div:last-child{border-bottom:0}.recipe-source{margin-top:12px}'
          s = s.replace(old_css, new_css)

          start = s.find('function deleteRecipe(i,e){')
          end = s.find('\nfunction openRecipeDetail', start)
          if start != -1 and end != -1:
              fn = '''function deleteRecipe(i,e){if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()}if(!Number.isInteger(i)||i<0||i>=data.recipes.length)return;let name=data.recipes[i]?.name||'this recipe';if(!confirm('Delete '+name+'?'))return;data.recipes.splice(i,1);localStorage.setItem(KEY,JSON.stringify(data));render();show('recipes')}'''
              s = s[:start] + fn + s[end:]

          start = s.find('function openRecipeDetail(i){')
          end = s.find('\nfunction testRecipePreview', start)
          if start != -1 and end != -1:
              fn = '''function openRecipeDetail(i){let x=data.recipes[i];if(!x)return;openModal('Recipe','');let ingredients=(x.notes||'').split('\\n').map(v=>v.trim()).filter(Boolean);document.getElementById('mb').innerHTML='<div class="recipe-detail-wrap">'+(x.image?'<img class="recipe-detail-img" src="'+x.image+'">':'<div class="recipe-detail-img"></div>')+'<div class="recipe-detail-info"><h2>'+x.name+'</h2><div class="small">🍴 Recipes</div><div class="small">📅 '+x.date+'</div><div class="small">🏷 '+(x.source||'Recipe Capture')+'</div></div></div>'+(ingredients.length?'<div class="recipe-detail-ingredients"><b>Ingredients</b>'+ingredients.map(v=>'<div>'+v+'</div>').join('')+'</div>':'')+(x.link?'<div class="recipe-source"><div class="small">Source</div><div>'+x.link+'</div></div>':'')+'<button class="btn full" onclick="closeModal()">Done</button><button class="recipe-delete full" style="margin-top:8px" onclick="deleteRecipeFromDetail('+i+')">Delete recipe</button>';document.querySelector('#modal .sheet > .row').style.display='none'}\nfunction deleteRecipeFromDetail(i){if(!Number.isInteger(i)||i<0||i>=data.recipes.length)return;let name=data.recipes[i]?.name||'this recipe';if(!confirm('Delete '+name+'?'))return;data.recipes.splice(i,1);localStorage.setItem(KEY,JSON.stringify(data));closeModal();render();show('recipes')}'''
              s = s[:start] + fn + s[end:]

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix recipe deletion [skip ci]'
          git push
