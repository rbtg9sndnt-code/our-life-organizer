name: Fix recipe deletion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch recipe delete on latest main
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function deleteRecipe(i,e){if(e)e.stopPropagation();let x=data.recipes[i];if(!x)return;if(!confirm('Delete this recipe?'))return;data.recipes.splice(i,1);save()}"
          new = "function deleteRecipe(i,e){if(e){e.preventDefault();e.stopPropagation()}if(!Number.isInteger(i)||i<0||i>=data.recipes.length)return;data.recipes.splice(i,1);save();show('recipes')}"
          if old in s:
              s = s.replace(old, new, 1)
          old2 = "<button class=\"recipe-delete\" onclick=\"deleteRecipe('+i+',event)\">Delete recipe</button>"
          new2 = "<button type=\"button\" class=\"recipe-delete\" onclick=\"deleteRecipe('+i+',event)\">Delete recipe</button>"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
            if git diff --quiet -- index.html; then
              echo 'Recipe delete fix is already present.'
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix recipe deletion"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; continue; }
            if git push origin HEAD:main; then
              echo 'Recipe delete fix pushed.'
              rm -f .github/workflows/fix-recipe-delete-2.yml
              git fetch origin main
              git reset --hard origin/main
              git add -A
              git commit --allow-empty -m "Remove one-time recipe fix workflow" || true
              git push origin HEAD:main || true
              exit 0
            fi
          done
          exit 1
