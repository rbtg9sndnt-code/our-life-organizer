name: Apply folders navigation change
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only bottom navigation item
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          b = p.read_bytes()
          old = '<button onclick="show(\'us\')" id="n-us"><b>♡</b>Us</button>'.encode('utf-8')
          new = '<button onclick="show(\'folders\')" id="n-folders"><b>□</b>Folders</button>'.encode('utf-8')
          if b.count(old) != 1:
              raise SystemExit(f'Expected exactly one navigation item, found {b.count(old)}')
          p.write_bytes(b.replace(old, new, 1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-folders-nav.yml
          git commit -m "Change bottom nav from Us to Folders"
          git push
