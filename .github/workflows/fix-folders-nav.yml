name: Apply folders navigation change
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only bottom navigation item
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<button onclick="show(\'us\')" id="n-us"><b>♡</b>Us</button>'
          new = '<button onclick="show(\'folders\')" id="n-folders"><b>□</b>Folders</button>'
          if old not in s:
              raise SystemExit('Expected navigation text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-folders-nav.yml
          git commit -m "Change bottom nav from Us to Folders"
          git push
