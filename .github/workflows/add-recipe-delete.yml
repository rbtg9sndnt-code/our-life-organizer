name: Add recipe delete

on:
  push:
    paths:
      - '.github/workflows/add-recipe-delete.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add delete recipe controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css = '.recipe-delete{border:1px solid #ff202855;background:#211014;color:#ff6268;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:750;margin-top:7px}.recipe-delete:active{opacity:.7}'
          marker = '.recipe-item{cursor:pointer}'
          if css not in s:
              s = s.replace(marker, marker + css)

          fn = "function deleteRecipe(i,e){if(e)e.stopPropagation();let x=data.recipes[i];if(!x)return;if(!confirm('Delete this recipe?'))return;data.recipes.splice(i,1);save()}"
          marker = 'function openRecipeDetail(i){'
          if fn not in s:
              s = s.replace(marker, fn + marker)

          old = "'<div class=\"small\">'+(x.source||'Saved')+' · '+x.date+'</div></div><span>›</span></div></div>').join(''):'<div class=\"empty\">No recipes saved yet.</div>';"
          new = "'<div class=\"small\">'+(x.source||'Saved')+' · '+x.date+'</div><button class=\"recipe-delete\" onclick=\"deleteRecipe('+i+',event)\">Delete recipe</button></div><span>›</span></div></div>').join(''):'<div class=\"empty\">No recipes saved yet.</div>';"
          if old not in s:
              raise SystemExit('Recipe render pattern not found; no changes made.')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit recipe delete update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add recipe delete button [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
