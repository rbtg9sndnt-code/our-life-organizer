name: One-time recipe delete fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recipe delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "function deleteRecipe(i,e){if(e)e.stopPropagation();let x=data.recipes[i];if(!x)return;if(!confirm('Delete this recipe?'))return;data.recipes.splice(i,1);save()}"
          new = "function deleteRecipe(i,e){if(e){e.preventDefault();e.stopPropagation()}if(!Number.isInteger(i)||i<0||i>=data.recipes.length)return;data.recipes.splice(i,1);save();show('recipes')}"
          if old not in s:
              raise SystemExit('Expected deleteRecipe function not found')
          s = s.replace(old, new, 1)
          old2 = "<button class=\"recipe-delete\" onclick=\"deleteRecipe('+i+',event)\">Delete recipe</button>"
          new2 = "<button type=\"button\" class=\"recipe-delete\" onclick=\"deleteRecipe('+i+',event)\">Delete recipe</button>"
          if old2 not in s:
              raise SystemExit('Expected recipe delete button not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix recipe deletion" || true
          rm -f .github/workflows/fix-recipe-delete.yml
          git add -A
          git commit -m "Remove one-time recipe fix workflow" || true
          git push
