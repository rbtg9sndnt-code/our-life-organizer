name: Upgrade Quick Capture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade capture UI and wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
              "const KEY='our_app_data_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{\"plans\":[],\"bills\":[],\"pays\":[],\"recipes\":[],\"us\":[],\"bike\":[],\"folders\":[],\"goal\":0,\"billAccount\":0,\"billTransactions\":[],\"safeSpendManual\":null}');",
              "const KEY='our_app_data_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{\"plans\":[],\"bills\":[],\"pays\":[],\"recipes\":[],\"us\":[],\"bike\":[],\"folders\":[],\"goal\":0,\"billAccount\":0,\"billTransactions\":[],\"safeSpendManual\":null,\"captures\":[]}');if(!Array.isArray(data.captures))data.captures=[];"
          )

          def replace_fn(name, replacement, next_name):
              pattern = rf"function {re.escape(name)}\([^)]*\)\{{.*?\}}function {re.escape(next_name)}"
              global s
              s, n = re.subn(pattern, replacement + f"function {next_name}", s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace {name}()')

          replace_fn('openCapture', r'''function openCapture(){openModal('Quick Capture','<div class="small">Throw anything in here — screenshot, photo, link, idea, note, product, message or anything else. AI will try to understand it, but saving never depends on recognition.</div><textarea id="captureText" rows="4" placeholder="Add a note, context, link or question…"></textarea><input id="captureFile" type="file" accept="image/*,video/*" onchange="captureSelected()"><div id="capturePreview" class="capture-preview"></div><div id="captureAi" class="ai-preview" style="display:none"></div>')}''', 'openRecipe')

          replace_fn('testRecipePreview', r'''function testRecipePreview(target){target.innerHTML='<b>AI suggestion</b><div>Reading your capture…</div><div class="small" style="margin-top:8px">It can recognize recipes, products, shopping items, notes, ideas, tasks, events and more.</div>';target.style.display='block'}''', 'captureSelected')

          replace_fn('captureSelected', r'''async function captureSelected(){let f=document.getElementById('captureFile').files[0];if(!f)return;let p=document.getElementById('capturePreview'),ai=document.getElementById('captureAi');if(f.type.startsWith('image/')){let r=new FileReader();r.onload=async()=>{p.innerHTML='<img src="'+r.result+'">';p.style.display='block';await runCaptureAI(r.result,document.getElementById('captureText').value.trim())};r.readAsDataURL(f)}else{p.innerHTML='<div class="card">Video selected. It will be saved to your inbox with your note.</div>';p.style.display='block';ai.style.display='block';ai.innerHTML='<b>AI suggestion</b><div>Video capture → Inbox</div><div class="small" style="margin-top:8px">Video is kept as an attachment; add a note above if you want extra context.</div>'}}''', 'recipeSelected')

          generic_ai = r'''async function runCaptureAI(image,text){let ai=document.getElementById('captureAi');ai.style.display='block';ai.innerHTML='<b>AI suggestion</b><div>Understanding your capture…</div>';try{let res=await fetch('/api/capture-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,text})});let out=await res.json();if(!res.ok)throw new Error(out.error||'AI request failed');window._captureAI=out;ai.innerHTML='<b>AI suggestion: '+escapeHtml(out.category||'Capture')+' → '+escapeHtml(out.suggestedDestination||'Inbox')+'</b><div style="font-size:18px;font-weight:750;margin-bottom:6px">'+escapeHtml(out.title||'Captured item')+'</div><div>'+escapeHtml(out.summary||'Saved as a general capture.')+'</div>'+(out.extractedText?'<div class="small" style="margin-top:8px;white-space:pre-wrap">'+escapeHtml(out.extractedText)+'</div>':'')+'<div class="small" style="margin-top:8px">You can still save it even if AI is unsure.</div>'}catch(e){window._captureAI={title:'Unsorted capture',category:'other',summary:'AI could not interpret this image. Your screenshot and note will still be saved.',suggestedDestination:'Inbox',extractedText:''};ai.innerHTML='<b>AI could not fully understand this image</b><div>Your screenshot and note will still be saved safely to Quick Capture.</div><div class="small" style="margin-top:8px">You can organize it later.</div>'}}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}'''
          marker = 'function recipeSelected()'
          if generic_ai + marker not in s:
              s = s.replace(marker, generic_ai + marker, 1)

          old_capture = r"if\(title==='Quick Capture'\)\{.*?\}if\(title==='Save a Recipe'\)"
          new_capture = r'''if(title==='Quick Capture'){let text=document.getElementById('captureText').value.trim(),file=document.getElementById('captureFile').files[0];if(!text&&!file)return alert('Add a note, link, screenshot or photo first.');let saveCapture=(image)=>{let ai=window._captureAI||{title:text?text.slice(0,80):'Unsorted capture',category:'other',summary:'Saved to Quick Capture inbox.',suggestedDestination:'Inbox',extractedText:''};data.captures.push({title:ai.title||'Unsorted capture',category:ai.category||'other',summary:ai.summary||'',suggestedDestination:ai.suggestedDestination||'Inbox',extractedText:ai.extractedText||'',text,image:image||'',date:new Date().toLocaleDateString(),source:'Quick Capture'});window._captureAI=null;closeModal();save();show('notes')};if(file&&file.type.startsWith('image/')){let r=new FileReader();r.onload=()=>saveCapture(r.result);r.readAsDataURL(file);return}saveCapture('')}if(title==='Save a Recipe')'''
          s, n = re.subn(old_capture, new_capture, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace Quick Capture save logic')

          notes_render = r'''let capturesHtml=data.captures.length?data.captures.slice().reverse().map((x,i)=>'<div class="item"><div class="row">'+(x.image?'<img class="recipe-thumb" src="'+x.image+'">':'')+'<div class="grow"><b>'+escapeHtml(x.title||'Unsorted capture')+'</b><div class="small">'+escapeHtml(x.category||'other')+' · '+escapeHtml(x.suggestedDestination||'Inbox')+' · '+escapeHtml(x.date||'')+'</div>'+(x.summary?'<div style="margin-top:5px">'+escapeHtml(x.summary)+'</div>':'')+(x.text?'<div class="small" style="margin-top:5px;white-space:pre-wrap">Your note: '+escapeHtml(x.text)+'</div>':'')+'</div></div></div>').join(''):'<div class="empty">Nothing captured yet.</div>';document.getElementById('notesList').innerHTML=capturesHtml;'''
          marker2 = "document.getElementById('planList').innerHTML="
          if "let capturesHtml=data.captures.length?" not in s:
              s = s.replace(marker2, notes_render + marker2, 1)

          p.write_text(s)

      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make Quick Capture accept any screenshot or note'
          git push
