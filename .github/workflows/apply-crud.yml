name: Apply organizer CRUD

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply CRUD code
        shell: python
        run: |
          from pathlib import Path
          import re
          wf = Path('.github/workflows/upgrade-crud.yml').read_text()
          m = re.search(r"code = r'''(.*?)'''", wf, re.S)
          if not m:
              raise SystemExit('CRUD code block not found')
          code = m.group(1)
          p = Path('index.html')
          s = p.read_text()
          css = r'''<style>.crud-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.crud-btn{border:1px solid #ffffff18;background:#222227;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:750}.crud-btn.delete{border-color:#ff202855;color:#ff6268}.crud-btn:active{opacity:.7}</style>'''
          if 'class="crud-actions"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          if 'function crudEditCapture' not in s:
              s = s.replace('</script></body></html>', code + '</script></body></html>', 1)
          s = s.replace('render();</script></body></html>', 'render();renderCrud();</script></body></html>', 1)

          bill_marker = '/* BILL_FUND_CHAT_COMMANDS_V1 */'
          if bill_marker not in s:
              bill_code = r'''
/* BILL_FUND_CHAT_COMMANDS_V1 */
(function(){
  const originalChat = chat;
  function billCommandAmount(message){
    const m = String(message || '').match(/\b(?:add|put|set\s+aside)\s*\$?\s*([\d,]+(?:\.\d{1,2})?)\s*\$?\s*(?:to|into|in)\s+(?:my\s+)?(?:bill\s+fund|bill\s+account|bills?\s+fund)\b/i);
    return m ? Number(String(m[1]).replace(/,/g,'')) : null;
  }
  chat = async function(messageOverride){
    const input = document.getElementById('chatInput');
    const v = String(messageOverride || input.value || '').trim();
    if(!v)return;
    const amount = billCommandAmount(v);
    if(amount !== null && Number.isFinite(amount) && amount > 0){
      data.billAccount = Number(data.billAccount || 0) + amount;
      if(!Array.isArray(data.billTransactions)) data.billTransactions = [];
      data.billTransactions.push({type:'add',amount,date:new Date().toLocaleDateString(),note:v});
      const chatBox = document.getElementById('chat');
      chatBox.innerHTML += '<div class="item"><b>You</b><div>'+escapeHtml(v)+'</div></div>';
      chatBox.innerHTML += '<div class="item"><b>OUR AI</b><div>Done — I added '+money(amount)+' to your Bill Fund. Your Bill Fund is now '+money(data.billAccount)+'.</div></div>';
      input.value='';
      save();
      show('money');
      return;
    }
    return originalChat(messageOverride);
  };
})();
'''
              s = s.replace('</script></body></html>', bill_code + '</script></body></html>', 1)

          paid_marker = '/* MONTHLY_BILL_PAID_V1 */'
          if paid_marker not in s:
              paid_css = r'''<style>
.monthly-bill-paid{opacity:.72}.monthly-bill-paid .bill-name{text-decoration:line-through}.bill-paid-btn{border:1px solid #ffffff18;background:#222227;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:750}.bill-paid-btn.is-paid{border-color:#36c98a55;color:#5de0a3;background:#14251e}.bill-status{font-size:12px;color:#92929b;margin-top:5px}.bill-summary{display:flex;justify-content:space-between;gap:12px;margin:0 0 10px;padding:10px 12px;border-radius:12px;background:#19191d}.bill-summary b{font-size:15px}
</style>'''
              s = s.replace('</head>', paid_css + '</head>', 1)
              paid_code = r'''
/* MONTHLY_BILL_PAID_V1 */
(function(){
  function billMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  function billPaid(x){return x && x.paidMonth===billMonth()}
  window.toggleBillPaid=function(i){
    const x=data.bills[i];
    if(!x)return;
    if(billPaid(x)) delete x.paidMonth;
    else x.paidMonth=billMonth();
    save();
  };
  window.renderMonthlyBillPaid=function(){
    const list=document.getElementById('billList');
    if(!list)return;
    const month=billMonth();
    let paidTotal=0, unpaidTotal=0;
    data.bills.forEach(x=>{const amount=Number(x.amount||0);if(x.paidMonth===month)paidTotal+=amount;else unpaidTotal+=amount});
    const monthly=document.getElementById('monthlyBillsTotal');
    const after=document.getElementById('afterBillsBalance');
    const monthlyLabel=monthly&&monthly.parentElement&&monthly.parentElement.querySelector('.small');
    if(monthlyLabel)monthlyLabel.textContent='BILLS LEFT THIS MONTH';
    if(monthly)monthly.textContent=money(unpaidTotal);
    if(after)after.textContent=money(Number(data.billAccount||0)-unpaidTotal);
    const summary='<div class="bill-summary"><div><div class="small">PAID THIS MONTH</div><b>'+money(paidTotal)+'</b></div><div style="text-align:right"><div class="small">LEFT TO PAY</div><b>'+money(unpaidTotal)+'</b></div></div>';
    const rows=data.bills.map((x,i)=>{
      const paid=billPaid(x), amount=Number(x.amount||0);
      return '<div class="item '+(paid?'monthly-bill-paid':'')+'"><b class="bill-name">'+esc(x.name||'Bill')+'</b><span style="float:right">'+money(amount)+'</span><div class="small">'+esc(x.freq||'')+(x.date?' · due '+esc(x.date):'')+'</div><div class="bill-status">'+(paid?'✓ Paid for '+month:'Not paid yet this month')+'</div><div class="crud-actions">'+crudButton(paid?'Unpay':'Paid','toggleBillPaid('+i+')',false).replace('class="crud-btn"','class="bill-paid-btn '+(paid?'is-paid':'')+'"')+crudButton('Edit','editBill('+i+')')+crudButton('Delete','crudDelete(\'bill\','+i+')',true)+'</div></div>';
    }).join('');
    list.innerHTML=summary+(rows||'<div class="empty">No bills added.</div>');
  };
  const originalRender=render;
  render=function(){originalRender();renderMonthlyBillPaid()};
  renderMonthlyBillPaid();
})();
'''
              token='render();</script></body></html>'
              if token in s:
                  s=s.rsplit(token,1)[0]+paid_code+'\nrender();</script></body></html>'
              else:
                  s=s.replace('</script></body></html>', paid_code+'\n</script></body></html>',1)
          p.write_text(s)
      - name: Commit CRUD upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply organizer edit delete and bill fund controls'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
